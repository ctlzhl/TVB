<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TVB 主题乐园｜八大场景概念展</title>
  <style>
    :root{--jade:#0a6e5f;--gold:#d7ae5a;--cream:#f3efe4;--ink:#14221f}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 10% -10%,rgba(215,174,90,.26),transparent 24rem),var(--cream);font-family:"PingFang SC","Microsoft YaHei",sans-serif}main{min-height:100vh;padding:20px clamp(16px,3vw,56px)}header,.intro,.stage,.scene-nav,footer{max-width:1440px;margin-left:auto;margin-right:auto}header{display:flex;align-items:center;gap:12px;padding:7px 0 24px}.logo{width:42px;height:42px;border:3px solid var(--jade);border-radius:50%;display:grid;place-items:center}.logo i{width:20px;height:5px;background:var(--jade);border-radius:20px}.kicker,.eyebrow{margin:0;color:var(--jade);font-weight:800;font-size:12px;letter-spacing:.14em}.brand{margin:2px 0 0;font:700 19px/1 "Songti SC","STSong",serif}.note{margin-left:auto;color:#65736e;font-size:14px}.intro{min-height:118px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:16px}.intro h1{margin:6px 0 8px;font:700 clamp(32px,4.4vw,64px)/1.05 "Songti SC","STSong",serif;letter-spacing:-.04em}.intro p:not(.eyebrow){max-width:600px;margin:0;color:#53615c;line-height:1.7}.back{border:1px solid rgba(10,110,95,.32);border-radius:99px;padding:11px 16px;color:#063f3a;background:#fff9;cursor:pointer}.stage{position:relative;aspect-ratio:16/9;overflow:hidden;background:#24443e;border:1px solid #063f3a40;box-shadow:0 24px 70px #112d2e30}.stage>img{width:100%;height:100%;display:block;object-fit:cover}.scene-nav{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:9px;margin-top:16px}.card{position:relative;overflow:hidden;aspect-ratio:1/1.08;padding:0;border:2px solid transparent;color:#fff;background:#183a34;cursor:pointer;text-align:left}.card img{width:100%;height:100%;object-fit:cover;opacity:.8}.card:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,#051f1de0)}.card.active{border-color:var(--gold);box-shadow:0 0 0 2px #d7ae5a47}.no,.name{position:absolute;z-index:1;left:9px}.no{top:8px;color:var(--gold);font-weight:900;font-size:12px;letter-spacing:.08em}.name{right:9px;bottom:8px;font:700 14px/1.2 "Songti SC","STSong",serif}footer{margin-top:16px;color:#68736e;font-size:13px}@media(max-width:820px){main{padding:16px}.note{display:none}.intro{min-height:auto;align-items:flex-start;margin-bottom:12px}.intro h1{font-size:34px}.intro p:not(.eyebrow){font-size:14px}.back{font-size:12px;padding:8px 12px}.stage{aspect-ratio:4/3}.scene-nav{grid-template-columns:repeat(4,minmax(0,1fr))}}
  </style>
</head>
<body>
  <main>
    <header><div class="logo"><i></i></div><div><p class="kicker">TVB THEME PARK</p><p class="brand">TVB 主题乐园</p></div><p class="note">八大场景概念展</p></header>
    <section class="intro"><div><p class="eyebrow" id="eyebrow"></p><h1 id="title"></h1><p id="desc"></p></div><button class="back" id="back" hidden>返回全景总览</button></section>
    <section class="stage"><img id="sceneImage" alt="TVB 主题乐园"/></section>
    <nav class="scene-nav" id="sceneNav"></nav>
    <footer>从下方场景带切换画面。</footer>
  </main>
  <script>
    const scenes=[
      [1,'主题乐园全景总览','场景 01 · TVB 主题乐园','从翡翠电视城出发，走进八个持续上演故事的片场世界。','scene-01-overview.webp'],
      [2,'翡翠时光广场','场景 02 · 星光门厅','巨型电视门、TVB 塔楼与跨年代星光迎宾 NPC，是进入乐园的第一幕。','scene-02-entrance.webp','50%','82%'],
      [3,'香港故事街','场景 03 · 都市职业剧','茶餐厅、屋邨、医院、法庭与商战片场在同一条街上同时开拍。','scene-03-city-street.webp','21%','50%'],
      [4,'罪案行动中心','场景 04 · 法证与刑侦','从报案、鉴证到庭审，游客与法证、刑侦角色 NPC 一起推进案件。','scene-04-crime.webp','38%','32%'],
      [5,'古装武侠影城','场景 05 · 江湖与宫廷','城门、市集、宫苑与威亚片场共同构成可进入的 TVB 古装剧世界。','scene-05-wuxia.webp','68%','28%'],
      [6,'情景剧与片场中心','场景 06 · 邻里喜剧','屋邨、茶餐厅与多机位摄影棚相连，每天都有一集新的社区故事。','scene-06-sitcom.webp','57%','49%'],
      [7,'万千星辉综艺馆','场景 07 · 全家欢舞台','台庆、港姐、欢乐今宵与 430 穿梭机的节目记忆，在这里重新开场。','scene-07-variety.webp','62%','71%'],
      [8,'资讯生活台','场景 08 · 新闻与生活','新闻直播、东张式民生调查与流行都市生活体验，在真实片场中发生。','scene-08-news.webp','90%','51%']
    ];
    let active=1;const $=s=>document.querySelector(s);const image=$('#sceneImage'),nav=$('#sceneNav');
    function render(){const s=scenes.find(x=>x[0]===active);$('#eyebrow').textContent=s[2];$('#title').textContent=s[1];$('#desc').textContent=s[3];image.src='scenes/'+s[4];image.alt=s[1];$('#back').hidden=active===1;nav.innerHTML='';scenes.forEach(x=>{const b=document.createElement('button');b.className='card '+(x[0]===active?'active':'');b.innerHTML='<img src="scenes/'+x[4]+'" alt=""><span class="no">'+String(x[0]).padStart(2,'0')+'</span><span class="name">'+x[1]+'</span>';b.onclick=()=>{active=x[0];render()};nav.appendChild(b)})}$('#back').onclick=()=>{active=1;render()};render();
  </script>
</body>
</html>
