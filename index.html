<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#072d2c">
  <title>TVB 主题乐园</title>
  <style>
    :root{--jade:#0e6d63;--deep:#062d2b;--gold:#e7bd68;--paper:#f7f1e6;--ink:#182a27}*{box-sizing:border-box}html{background:#082d2b}body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:640px;min-height:100svh;margin:auto;background:var(--paper);box-shadow:0 0 50px #0004}.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;color:#fff;background:#082d2bf2;backdrop-filter:blur(12px)}.mark{width:30px;height:30px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center}.mark:after{content:"";width:13px;height:4px;border-radius:99px;background:var(--gold)}.topbar p{margin:0}.overline{color:#d7c79e;font-size:10px;font-weight:800;letter-spacing:.17em}.brand{font:700 18px/1.15 "Songti SC","STSong",serif}.return{display:none;margin-left:auto;border:1px solid #ffffff55;border-radius:999px;padding:7px 10px;color:#fff;background:#ffffff14;font-size:12px}.return.show{display:block}.hero{padding:20px 18px 12px}.eyebrow{margin:0;color:var(--jade);font-size:11px;font-weight:800;letter-spacing:.14em}.hero h1{margin:6px 0 6px;font:700 clamp(30px,8vw,46px)/1.05 "Songti SC","STSong",serif;letter-spacing:-.04em}.hero p:last-child{margin:0;color:#5c6a65;font-size:14px;line-height:1.65}.viewer-wrap{padding:0 12px}.viewer{position:relative;overflow:hidden;border-radius:22px;background:#183a35;box-shadow:0 16px 34px #17332d2b}.viewer img{display:block;width:100%;aspect-ratio:9/16;object-fit:cover}.hotspot-layer{position:absolute;inset:0}.hotspot{position:absolute;transform:translate(-50%,-50%);width:16%;height:10%;border:0;border-radius:50%;background:transparent;cursor:pointer}.hotspot:focus-visible{outline:2px solid var(--gold);outline-offset:-3px}.hotspot:hover{background:#e7bd681a}.map-label{position:absolute;z-index:2;max-width:82px;transform:translate(-50%,10px);border:1px solid #ffe5a866;border-radius:999px;padding:4px 7px;color:#fff5d6;background:#082d2bd9;box-shadow:0 2px 8px #001b1999;font:700 10px/1.15 "PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.01em;white-space:normal;text-align:center;cursor:pointer;backdrop-filter:blur(3px)}.map-label:hover,.map-label:focus-visible{color:#182a27;background:var(--gold);outline:none}.map-label.entrance{transform:translate(-50%,-125%)}.caption{position:absolute;right:10px;bottom:10px;left:10px;padding:13px 14px;border-radius:14px;color:#fff;background:linear-gradient(90deg,#082d2be8,#082d2b88);font-size:13px;line-height:1.45}.caption strong{display:block;margin-bottom:2px;font:700 18px/1.2 "Songti SC","STSong",serif}.overview .caption{display:none}.hint{display:flex;align-items:center;gap:8px;margin:14px 18px 12px;color:#52645e;font-size:13px}.hint i{width:18px;height:18px;border:1px solid var(--jade);border-radius:50%;display:grid;place-items:center;color:var(--jade);font-style:normal;font-size:11px}.section-title{display:flex;justify-content:space-between;align-items:baseline;margin:0 18px 10px}.section-title h2{margin:0;font:700 19px/1 "Songti SC","STSong",serif}.section-title span{color:#73827b;font-size:12px}.scene-strip{display:flex;gap:9px;overflow-x:auto;padding:0 18px calc(22px + env(safe-area-inset-bottom));scrollbar-width:none}.scene-strip::-webkit-scrollbar{display:none}.scene{position:relative;flex:0 0 92px;height:130px;overflow:hidden;border:2px solid transparent;border-radius:13px;padding:0;color:#fff;background:#173a35;text-align:left;cursor:pointer}.scene img{width:100%;height:100%;object-fit:cover}.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,#031b1be6)}.scene.active{border-color:var(--gold);box-shadow:0 0 0 2px #e7bd6840}.scene span{position:absolute;z-index:1;right:7px;bottom:7px;left:7px;font:700 12px/1.16 "Songti SC","STSong",serif}.scene .tag{top:7px;right:auto;bottom:auto;left:7px;color:#fae1a4;font:800 9px/1 sans-serif;letter-spacing:.06em}.toast{position:fixed;right:18px;bottom:18px;z-index:20;max-width:min(330px,calc(100vw - 36px));padding:11px 14px;border-radius:13px;color:#fff;background:#082d2be8;box-shadow:0 8px 22px #0003;font-size:13px;transform:translateY(120%);opacity:0;transition:.25s}.toast.show{transform:translateY(0);opacity:1}@media(min-width:641px){body{padding:22px;background:linear-gradient(125deg,#0d3430,#d7c195)}.app{border-radius:28px;overflow:hidden}.viewer-wrap{padding-inline:18px}.hero{padding-inline:24px}.scene-strip{padding-inline:24px}.section-title,.hint{margin-inline:24px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><span class="mark" aria-hidden="true"></span><div><p class="overline">TVB THEME PARK</p><p class="brand">TVB 主题乐园</p></div><button id="return" class="return" type="button">返回总览</button></header>
    <section class="hero"><p id="eyebrow" class="eyebrow"></p><h1 id="title"></h1><p id="description"></p></section>
    <section class="viewer-wrap"><div id="viewer" class="viewer overview"><img id="sceneImage" alt="TVB 主题乐园总览"><div id="hotspots" class="hotspot-layer"></div><div id="caption" class="caption"></div></div></section>
    <p id="hint" class="hint"><i>↗</i>点击总览中的主题地标，进入对应场景</p>
    <section class="section-title"><h2>探索主题区</h2><span id="counter"></span></section>
    <nav id="sceneStrip" class="scene-strip" aria-label="主题场景"></nav>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script>
    const scenes = [
      {id:'overview',tag:'总览',title:'TVB 主题乐园',eyebrow:'全景总览 · 点击地标探索',description:'十二个主题区围绕翡翠时光广场展开。点击地图中的不同区域，进入对应的 TVB 故事场景。',image:'scenes/scene-01-overview.webp'},
      {id:'entrance',tag:'广场',title:'翡翠时光广场',eyebrow:'场景 02 · 星光入口',description:'穿过电视城入口，在跨年代经典人物的迎接下开启游园。',image:'scenes/scene-02-entrance.webp',x:50,y:92},
      {id:'family',tag:'3.1',title:'家族／商战系列',eyebrow:'金融家族城',description:'证券大厅、豪宅与珠宝行组成的港式商战舞台。',image:'scenes/scene-03-1-family-business.webp',x:19,y:35},
      {id:'sitcom',tag:'3.2',title:'情景剧系列',eyebrow:'社区摄影棚',description:'屋邨、茶餐厅与多机位摄影棚相连的欢乐日常。',image:'scenes/scene-03-2-sitcom.webp',x:19,y:49},
      {id:'wuxia',tag:'3.3',title:'古装武侠 IP 系列',eyebrow:'山水江湖',description:'山门、竹林、瀑布与练武台构成可进入的武侠世界。',image:'scenes/scene-03-3-wuxia.webp',x:20,y:20},
      {id:'crime',tag:'3.4',title:'刑侦警匪系列',eyebrow:'都会刑侦街区',description:'警署、法证中心、指挥站与取证巷的现代港风故事线。',image:'scenes/scene-03-4-crime.webp',x:81,y:48},
      {id:'workplace',tag:'3.5',title:'时装／职场系列',eyebrow:'职业都市',description:'机场、医院、律所与新闻台组成的都市职场世界。',image:'scenes/scene-03-5-workplace.webp',x:78,y:37},
      {id:'fantasy',tag:'3.6',title:'都市传说／奇幻系列',eyebrow:'旧城奇幻街',description:'旧公寓、舞厅、书店与的士站隐藏着轻奇幻叙事。',image:'scenes/scene-03-6-urban-fantasy.webp',x:51,y:18},
      {id:'period',tag:'3.7',title:'古装正剧／戏说系列',eyebrow:'皇城与园林',description:'宫城、军阵、园林与戏台串联不同朝代的剧情。',image:'scenes/scene-03-7-period.webp',x:78,y:21},
      {id:'romance',tag:'3.8',title:'都市言情／小品剧',eyebrow:'港澳爱情街',description:'澳门旧街与六十年代片场交汇的浪漫喜剧街区。',image:'scenes/scene-03-8-romance.webp',x:18,y:64},
      {id:'variety',tag:'3.9',title:'综艺节目',eyebrow:'全家欢演播城',description:'奖门人、430 穿梭机与欢乐今宵的参与式舞台。',image:'scenes/scene-03-9-variety.webp',x:28,y:75},
      {id:'gala',tag:'3.10',title:'年度综艺',eyebrow:'台庆与红毯',description:'台庆、颁奖礼与港姐选举汇聚的庆典地标。',image:'scenes/scene-03-10-gala.webp',x:86,y:62},
      {id:'music',tag:'3.11',title:'音乐综艺／颁奖',eyebrow:'音乐现场',description:'露天舞台、排练室与音乐奖项步道的现场体验。',image:'scenes/scene-03-11-music.webp',x:60,y:60},
      {id:'news',tag:'3.12',title:'新闻资讯／纪录片',eyebrow:'资讯生活台',description:'透明新闻编辑部、外景调查与生活演播室向游客开放。',image:'scenes/scene-03-12-news.webp',x:84,y:78}
    ];
    let activeId='overview'; const byId=id=>scenes.find(scene=>scene.id===id); const $=selector=>document.querySelector(selector); const viewer=$('#viewer'), image=$('#sceneImage'), hotspots=$('#hotspots'), strip=$('#sceneStrip'), returnBtn=$('#return');
    function openScene(id,announce=true){
      activeId=id; const scene=byId(id), isOverview=id==='overview';
      $('#eyebrow').textContent=scene.eyebrow; $('#title').textContent=scene.title; $('#description').textContent=scene.description; image.src=scene.image; image.alt=scene.title; viewer.classList.toggle('overview',isOverview); $('#caption').innerHTML=isOverview?'':`<strong>${scene.title}</strong>${scene.description}`;
      returnBtn.classList.toggle('show',!isOverview); $('#hint').innerHTML=isOverview?'<i>↗</i>点击总览中的主题地标，进入对应场景':'<i>✓</i>已进入主题场景；可继续从下方切换'; hotspots.innerHTML='';
      if(isOverview)scenes.slice(1).forEach(item=>{const button=document.createElement('button');button.className='hotspot';button.style.left=item.x+'%';button.style.top=item.y+'%';button.setAttribute('aria-label','查看 '+item.title);button.addEventListener('click',()=>openScene(item.id));hotspots.appendChild(button);const label=document.createElement('button');label.className='map-label '+(item.id==='entrance'?'entrance':'');label.style.left=item.x+'%';label.style.top=item.y+'%';label.type='button';label.textContent=item.title;label.setAttribute('aria-label','查看 '+item.title);label.addEventListener('click',()=>openScene(item.id));hotspots.appendChild(label)});
      strip.innerHTML=''; scenes.forEach(item=>{const button=document.createElement('button');button.className='scene '+(item.id===id?'active':'');button.setAttribute('aria-label','查看 '+item.title);button.innerHTML=`<img src="${item.image}" alt=""><span class="tag">${item.tag}</span><span>${item.title}</span>`;button.addEventListener('click',()=>openScene(item.id));strip.appendChild(button)}); $('#counter').textContent=isOverview?'13 个主题场景':'场景 '+scene.tag;
      if(announce&&!isOverview){const toast=$('#toast');toast.textContent='已进入：'+scene.title;toast.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>toast.classList.remove('show'),1800)} window.scrollTo({top:0,behavior:'smooth'});
    }
    returnBtn.addEventListener('click',()=>openScene('overview',false)); openScene('overview',false);
  </script>
</body>
</html>
